name: Pipeline Inteligente

on:
  workflow_dispatch:

  schedule:
    - cron: '0 2 * * *'

  push:
    branches:
      - 'feature/**'
    paths:
      - 'src/**'
      - '!src/docs/**'

jobs:
  job_gerador:
    name: Produtor de Artefatos
    runs-on: ubuntu-latest

    steps:
      - name: Construir projeto e gerar relatorios
        run: |
          mkdir -p saida_build
          echo "Relatorio 1 gerado em $(date)" > saida_build/relatorio1.txt
          echo "Relatorio 2 gerado em $(date)" > saida_build/relatorio2.txt

      - name: Upload do artefato
        uses: actions/upload-artifact@v4
        with:
          name: meus-relatorios-oficiais
          path: saida_build/

  job_auditoria:
    name: Consumidor de Artefatos
    runs-on: ubuntu-latest
    needs: job_gerador

    steps:
      - name: Download do artefato
        uses: actions/download-artifact@v4
        with:
          name: meus-relatorios-oficiais

      - name: Verificar arquivos sobreviventes
        run: |
          ls -R
          cat relatorio1.txt
